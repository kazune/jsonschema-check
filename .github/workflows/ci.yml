name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustc --version
      - name: Run checks
        run: make ci

  release:
    name: Release Linux x86_64 musl binary
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and musl target
        run: |
          rustc --version
          rustup target add x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get install -y musl-tools
      - name: Build and verify musl binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/jsonschema-check --version
      - name: Package and verify release archive
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          name="jsonschema-check-${RELEASE_TAG//\//_}-x86_64-unknown-linux-musl"
          asset="$name.tar.gz"
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          mkdir -p "$staging/$name" "$staging/extracted"
          install -m 755 target/x86_64-unknown-linux-musl/release/jsonschema-check "$staging/$name/"
          cp README.md LICENSE CHANGELOG.md "$staging/$name/"
          tar -czf "$asset" -C "$staging" "$name"
          tar -xzf "$asset" -C "$staging/extracted"
          package="$staging/extracted/$name"
          test -x "$package/jsonschema-check"
          for file in README.md LICENSE CHANGELOG.md; do
            cmp "$file" "$package/$file"
          done
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
      - name: Attach archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          if gh release view -- "$RELEASE_TAG" > /dev/null; then
            gh release upload -- "$RELEASE_TAG" "$RELEASE_ASSET"
          else
            gh release create --verify-tag -- "$RELEASE_TAG" "$RELEASE_ASSET"
          fi
